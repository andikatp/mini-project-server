services:
  mini-project-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: mini-project-server:latest
    container_name: mini-project-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - APP_VERSION=${APP_VERSION:-1.0.0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
