name: Free Gemini PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Gemini AI Reviewer
        uses: jgunnink/gemini-review-bot@27ab3135f939e94c90197e347a0df5813e045a14 # v1.5.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          model: "gemini-3.8-flash"
          exclude_files: "bun.lockb, package-lock.json, **/node_modules/**, **/dist/**, **/node_modules/.prisma/**"
