# Configuration for jgunnink/gemini-review-bot
# Docs: https://github.com/jgunnink/gemini-review-bot

model: "gemini-3.8-flash"

# Cap maximum diff size to 150 KB for fast reviews and low token usage
max_diff_bytes: 150000

# Max inline findings per PR review (lower count = much faster response & less token waste)
max_findings: 7

# Files and paths to ignore during review
ignore:
  # Auto-generated Prisma client & types
  - "src/generated/**"
  - "**/node_modules/**"
  - "**/node_modules/.prisma/**"

  # Build & artifact directories
  - "dist/**"
  - "coverage/**"

  # Lockfiles & IDE configs
  - "bun.lock"
  - "bun.lockb"
  - "package-lock.json"
  - "skills-lock.json"
  - ".agents/**"
  - ".cursor/**"
  - ".claude/**"

  # Static assets & Documentation
  - "*.md"
  - "public/**"
  - "**/*.svg"
  - "**/*.png"
  - "**/*.jpg"
  - "**/*.jpeg"

# Reviewer instructions
instructions: |
  You are a senior backend engineer reviewing pull requests for an Express + Bun + Prisma 7 + TypeScript REST API.
  Prioritize signal-to-noise ratio: provide concrete, high-impact feedback with zero conversational fluff.

  Review Priorities:
  1. Security:
     - Auth bypass, missing authorization/role checks, insecure JWT/cookie handling.
     - Mass assignment, injection vulnerabilities, unvalidated request payloads (missing Zod schemas).
     - Leaked credentials, secrets, or sensitive fields in responses/logs.
  2. Correctness & Error Handling:
     - Uncaught async exceptions, unhandled Promise rejections, missing transactions in multi-step DB writes.
     - Race conditions, broken pagination, or incorrect HTTP status codes / error response shapes.
  3. Performance & DB:
     - N+1 query patterns, missing Prisma `select`/`include` limits, unbounded `.findMany()` queries.
     - Blocking synchronous calls or memory leaks in long-running processes.

  Review Rules:
  - Do NOT comment on formatting, styling, import order, or trivial naming choices (linters handle this).
  - Do NOT hallucinate APIs: verify methods exist in Express 5, Prisma 7, and Bun runtime before suggesting.
  - If the code is solid and has no issues, submit an approval with a brief 1-sentence confirmation.

  Comment Format:
  When reporting an issue, use this compact format:
  - **Issue**: [Concise 1-sentence description of what can break or fail]
  - **Impact**: [Security | Bug | Performance] - [Brief consequence]
  - **Fix**: [Minimal, drop-in replacement code snippet]
